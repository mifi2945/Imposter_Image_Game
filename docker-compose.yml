name: imposter-image-game

services:
  frontend:
    image: node:26.13.0-slim
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        npm install --global corepack
        corepack enable
        yarn install --immutable
        yarn dev --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  accounts-api:
    build:
      context: ./AccountsApi
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /tmp/keys
        openssl ecparam -name prime256v1 -genkey -noout -out /tmp/keys/ec_private.pem
        openssl ec -in /tmp/keys/ec_private.pem -pubout -out /tmp/keys/ec_public.pem 2>/dev/null
        exec env PRIVATE_KEY_PATH=/tmp/keys/ec_private.pem PUBLIC_KEY_PATH=/tmp/keys/ec_public.pem uv run uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PROJECT: local-dev
      ACCOUNTS_DB: "(default)"
      FIRESTORE_EMULATOR_HOST: firestore:8085
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      firestore:
        condition: service_healthy

  files-api:
    build:
      context: ./FilesApi
    ports:
      - "8003:8080"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  lobby-api:
    build:
      context: ./LobbyApi/api
    ports:
      - "8004:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      redis:
        condition: service_healthy

  orchestrator-api:
    build:
      context: ./OrchestratorApi
    ports:
      - "8002:8080"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  questions-api:
    build:
      context: ./QuestionsApi/api
    ports:
      - "8005:8080"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: questions
      PGUSER: questions
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy

  firestore:
    build:
      context: .
      dockerfile: Dockerfile.firebase-emulator
    ports:
      - "8085:8085"
      - "4000:4000"
    volumes:
      - firestore_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8085').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: questions
      POSTGRES_USER: questions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questions -d questions"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  firestore_data:
  postgres_data:
  redis_data:
