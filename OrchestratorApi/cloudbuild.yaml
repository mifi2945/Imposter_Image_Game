# Submit from the repository root. Override these defaults for the shared cluster.
# Defaults match the cluster and Docker repository in impostor-image-game-514519.
substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: impostor-repo
  _CLUSTER_NAME: imposter-cluster
  _CLUSTER_LOCATION: us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    dir: OrchestratorApi
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/orchestrator-api:${BUILD_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/orchestrator-api:${BUILD_ID}

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - >-
        sed -i
        "s|orchestrator-api:local|${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/orchestrator-api:${BUILD_ID}|"
        OrchestratorApi/k8s/orchestrator-api.yaml

  - name: gcr.io/cloud-builders/kubectl
    args: [apply, -f, OrchestratorApi/k8s/]
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args: [-n, orchestrator, rollout, status, deployment/orchestrator-api, --timeout=180s]
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/orchestrator-api:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
