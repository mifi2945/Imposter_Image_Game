[project]
name = "orchestrator-api"
version = "0.1.0"
description = "Orchestrator API for Imposter Image Game"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5,<1.0",
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "uvicorn[standard]>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
