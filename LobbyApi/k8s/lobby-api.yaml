apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-api
  namespace: lobbies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-api
  template:
    metadata:
      labels:
        app: lobby-api
    spec:
      containers:
        - name: lobby-api
          image: lobby-api:local
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_PUBLIC_KEY_PATH
              value: /var/run/secrets/accountsapi-es-public/public-key.pem
          volumeMounts:
            - name: jwt-public-key
              mountPath: /var/run/secrets/accountsapi-es-public
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jwt-public-key
          secret:
            secretName: accountsapi-es-public
            items:
              - key: public-key.pem
                path: public-key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-api
  namespace: lobbies
spec:
  type: ClusterIP
  selector:
    app: lobby-api
  ports:
    - name: http
      port: 80
      targetPort: http
