[project]
name = "files-api"
version = "0.1.0"
description = "File service API for Imposter Image Game"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5,<1.0",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1,<1.0",
    "pydantic-settings>=2.11,<3.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
