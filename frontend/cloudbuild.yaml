substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: impostor-repo
  _CLUSTER_NAME: imposter-cluster
  _CLUSTER_LOCATION: us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/frontend:${BUILD_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/frontend:${BUILD_ID}

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - >-
        sed -i
        "s|frontend:local|${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/frontend:${BUILD_ID}|"
        frontend/k8s/frontend.yaml

  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - frontend/k8s/00-namespace.yaml
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - frontend/k8s/frontend.yaml
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - rollout
      - status
      - deployment/frontend
      - --namespace=frontend
      - --timeout=180s
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/frontend:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
