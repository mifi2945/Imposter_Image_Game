---
apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "chat"
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "chat-api"
  namespace: "chat"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "chat-api"
  namespace: "chat"
  labels:
    app: "chat-api"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "chat-api"
  template:
    metadata:
      labels:
        app: "chat-api"
    spec:
      serviceAccountName: "chat-api"
      containers:
      - name: "chat-api"
        image: "us-central1-docker.pkg.dev/impostor-image-game-514519/impostor-repo/chat-api:latest"
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 180
      nodeSelector:
        cloud.google.com/compute-class: "default"
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "chat-api-hpa-xacp"
  namespace: "chat"
  labels:
    app: "chat-api"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "chat-api"
    apiVersion: "apps/v1"
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: 90