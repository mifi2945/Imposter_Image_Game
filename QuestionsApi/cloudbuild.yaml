substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: impostor-repo
  _CLUSTER_NAME: imposter-cluster
  _CLUSTER_LOCATION: us-central1

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/accountsapi-es-public/versions/latest
      env: JWT_PUBLIC_KEY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/questions-api:$BUILD_ID
      - -f
      - QuestionsApi/api/Dockerfile
      - QuestionsApi/api

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/questions-api:$BUILD_ID

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - >-
        sed -i
        "s|questions-api:local|${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/questions-api:$BUILD_ID|"
        QuestionsApi/k8s/questions-api.yaml

  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - QuestionsApi/k8s/00-namespace.yaml
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    secretEnv:
      - JWT_PUBLIC_KEY
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$JWT_PUBLIC_KEY" |
          kubectl create secret generic accountsapi-es-public \
            --namespace=questions \
            --from-file=public-key.pem=/dev/stdin \
            --dry-run=client -o yaml |
          kubectl apply -f -
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - QuestionsApi/k8s/postgres.yaml
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - rollout
      - status
      - statefulset/postgres
      - --namespace=questions
      - --timeout=240s
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

  - name: gcr.io/cloud-builders/kubectl
    args:
      - apply
      - -f
      - QuestionsApi/k8s/questions-api.yaml
    env:
      - CLOUDSDK_COMPUTE_REGION=${_CLUSTER_LOCATION}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/questions-api:$BUILD_ID
